[build-system]
requires = ["scikit-build-core~=0.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "halide-zlib"
version = "1.3.2"
maintainers = [{ name = "Alex Reinking", email = "reinking@google.com" }]
license = { file = "./repo/LICENSE" }
readme = { file = "./repo/README", content-type = "text/plain" }
requires-python = ">=3.10"

[tool.scikit-build]
cmake.version = ">=3.28"
cmake.source-dir = "."
wheel.install-dir = "halide-zlib"

# No Python extension modules, so use py3-none tag instead of cpXYZ
wheel.py-api = "py3"
