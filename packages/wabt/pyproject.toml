[build-system]
requires = ["scikit-build-core~=0.11.0"]
build-backend = "scikit_build_core.build"

[project]
name = "halide-wabt"
version = "1.0.39"
maintainers = [{ name = "Alex Reinking", email = "areinking@adobe.com" }]
license = { file = "./repo/LICENSE" }
readme = "./repo/README.md"
requires-python = ">=3.10"

[tool.scikit-build]
cmake.version = ">=3.28"
cmake.source-dir = "repo"
wheel.install-dir = "halide-wabt"

# No Python extension modules, so use py3-none tag instead of cpXYZ
wheel.py-api = "py3"

[tool.scikit-build.cmake.define]
# CMake standard variables
CMAKE_POSITION_INDEPENDENT_CODE = true

# wabt speicific variables
BUILD_LIBWASM = false
BUILD_TESTS = false
BUILD_TOOLS = false
USE_INTERNAL_SHA256 = true
WITH_EXCEPTIONS = true
