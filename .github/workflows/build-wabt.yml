name: Build WABT wheels

on:
  push:
    paths:
      - packages/wabt/**
  workflow_dispatch: {}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  build:
    needs: validate
    uses: ./.github/workflows/build-dependency.yml
    with:
      package: packages/wabt
    permissions:
      contents: write
      pages: write
      id-token: write
