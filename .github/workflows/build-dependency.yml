name: Build dependency package

on:
  workflow_call:
    inputs:
      package:
        description: Package directory to build.
        required: true
        type: string

jobs:
  check:
    name: Check for an existing release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build a matrix for a missing package version
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_deps.py ${{ inputs.package }}

  build:
    name: ${{ matrix.pkg }} / ${{ matrix.platform }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      CMAKE_GENERATOR: Ninja
      MACOSX_DEPLOYMENT_TARGET: "11"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-wheel
        with:
          package: ${{ inputs.package }}
          platform: ${{ matrix.platform }}
          artifact-name: wheel-${{ matrix.pkg }}-${{ matrix.platform }}
          container: ${{ matrix.container }}
          docker-image: ${{ matrix.docker_image }}
          manylinux-plat: ${{ matrix.manylinux_plat }}
          msvc-arch: ${{ matrix.msvc_arch }}
          wheel-plat: ${{ matrix.wheel_plat }}
          pin-gcc12: ${{ matrix.pin_gcc12 }}

  publish:
    name: Publish dependency release
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          DIST_DIR: dist
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_releases.py

  rebuild-index:
    needs: publish
    uses: ./.github/workflows/rebuild-index.yml
    permissions:
      contents: read
      pages: write
      id-token: write
