name: Build LLVM wheels

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      llvm_ref:
        description: LLVM git ref (tag, branch, or SHA)
        required: true
        type: string

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  check:
    name: Check for existing wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      llvm_ref: ${{ steps.check.outputs.llvm_ref }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ref and check releases
        id: check
        env:
          HALIDE_LLVM_REF: ${{ inputs.llvm_ref || 'main' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_llvm.py

  build:
    name: Build / ${{ matrix.platform }}
    needs: [check, validate]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      HALIDE_LLVM_REF: ${{ needs.check.outputs.llvm_ref }}
      GITHUB_TOKEN: ${{ github.token }}
      CMAKE_GENERATOR: Ninja
      MACOSX_DEPLOYMENT_TARGET: "11"
    steps:
      - uses: actions/checkout@v4

      # Keep GCC 12 for manylinux builds: newer libstdc++ symbols are not
      # repaired by auditwheel and break consumers with older toolchains.
      # VS 2022 remains pinned through the canonical LLVM matrix.
      - uses: ./.github/actions/build-wheel
        with:
          package: packages/halide-llvm
          platform: ${{ matrix.platform }}
          artifact-name: wheel-${{ matrix.pkg }}-${{ matrix.platform }}
          container: ${{ matrix.container }}
          docker-image: ${{ matrix.docker_image }}
          manylinux-plat: ${{ matrix.manylinux_plat }}
          msvc-arch: ${{ matrix.msvc_arch }}
          wheel-plat: ${{ matrix.wheel_plat }}
          pin-gcc12: ${{ matrix.pin_gcc12 }}
          toolchain: ${{ matrix.toolchain }}
          llvm-ref: ${{ needs.check.outputs.llvm_ref }}

  publish:
    name: Publish LLVM release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          DIST_DIR: dist
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_releases.py

  rebuild-index:
    needs: publish
    uses: ./.github/workflows/rebuild-index.yml
    permissions:
      contents: read
      pages: write
      id-token: write
