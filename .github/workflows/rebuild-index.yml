name: Rebuild index

# Deliberately workflow_dispatch-only, not "on: release: published". Every
# producer repo already calls `gh workflow run rebuild-index.yml` explicitly
# after publishing (see README), so nothing depends on the release webhook --
# and relying on both was actively harmful: a single build commonly publishes
# multiple releases (e.g. halide-wheel-deps builds halide-flatbuffers and
# halide-wabt together), so the implicit per-release webhook plus the
# explicit dispatch fire 3 near-simultaneous runs that race for the same
# GitHub Pages deployment lock and fail/cancel each other.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let queued runs wait rather than
# cancel each other, since we want every publish to eventually be reflected.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 generate_index.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
